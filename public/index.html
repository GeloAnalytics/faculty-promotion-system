<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Promotion Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-portal="auth">
    <div class="page-shell">
      <main class="content-grid">
        <section class="panel panel-wide" id="auth-panel">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Account Access</p>
              <h2>Sign in or create an account</h2>
            </div>
          </div>
          <div class="auth-switch">
            <button class="button button-primary auth-toggle" id="show-login" type="button">Sign In</button>
            <button class="button button-secondary auth-toggle" id="show-register" type="button">Create Account</button>
          </div>
          <form id="auth-form" class="stack-form">
            <label class="field" id="name-field">
              <span>Full name</span>
              <input type="text" id="auth-name" placeholder="Faculty Employee or Evaluator" />
            </label>
            <label class="field" id="role-field">
              <span>Account type</span>
              <select id="auth-role">
                <option value="EMPLOYEE">Employee</option>
                <option value="EVALUATOR">Evaluator</option>
              </select>
            </label>
            <label class="field">
              <span>Email</span>
              <input type="email" id="auth-email" placeholder="name@example.com" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input type="password" id="auth-password" placeholder="Minimum 8 characters" required />
            </label>
            <button class="button button-primary" id="auth-submit" type="submit">Sign In</button>
          </form>
          <div id="auth-result" class="notice">Choose sign in or create account to continue.</div>
        </section>
      </main>
    </div>

    <script src="/config.js?v=334eaba"></script>
    <script type="module" src="/app.js?v=334eaba"></script>
  </body>
</html>
