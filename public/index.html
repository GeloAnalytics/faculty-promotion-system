<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faculty Promotion Access Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body data-portal="auth">
    <div class="page-shell">
      <main class="content-grid">
        <section class="panel panel-wide" id="auth-panel">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Account Access</p>
              <h2>Sign in or create an account</h2>
            </div>
          </div>
          <div class="auth-switch">
            <button class="button button-primary auth-toggle" id="show-login" type="button">Sign In</button>
            <button class="button button-secondary auth-toggle" id="show-register" type="button">Create Account</button>
          </div>
          <form id="auth-form" class="stack-form">
            <label class="field" id="name-field">
              <span>Full name</span>
              <input type="text" id="auth-name" placeholder="Faculty or Evaluator" />
            </label>
            <label class="field" id="role-field">
              <span>Account type</span>
              <select id="auth-role">
                <option value="EMPLOYEE">Faculty</option>
                <option value="EVALUATOR">Evaluator</option>
              </select>
            </label>
            <label class="field" id="employee-id-field">
              <span>Faculty ID</span>
              <input type="text" id="auth-employee-id" placeholder="10-digit Faculty ID" inputmode="numeric" pattern="\d{10}" maxlength="10" />
            </label>
            <label class="field">
              <span>Email</span>
              <input type="email" id="auth-email" placeholder="name@example.com" required />
            </label>
            <label class="field">
              <span>Password</span>
              <input type="password" id="auth-password" placeholder="Minimum 8 characters" required />
            </label>
            <button class="button button-primary" id="auth-submit" type="submit">Sign In</button>
          </form>
          <div id="auth-result" class="notice">Choose sign in or create account to continue.</div>
        </section>
        <section class="panel panel-wide" id="force-password-panel" style="display: none">
          <div class="panel-heading">
            <div>
              <p class="section-kicker">Account Security</p>
              <h2>Set a new password</h2>
            </div>
          </div>
          <div class="notice">Your password was reset by an administrator. Enter the temporary password you were given, then choose a new one to continue.</div>
          <form id="force-password-form" class="stack-form">
            <label class="field">
              <span>Temporary password</span>
              <input type="password" id="force-current-password" placeholder="The temporary password you were given" required minlength="8" />
            </label>
            <label class="field">
              <span>New password</span>
              <input type="password" id="force-new-password" placeholder="Minimum 8 characters" required minlength="8" />
            </label>
            <label class="field">
              <span>Confirm new password</span>
              <input type="password" id="force-new-password-confirm" placeholder="Re-enter new password" required minlength="8" />
            </label>
            <button class="button button-primary" id="force-password-submit" type="submit">Set new password &amp; continue</button>
          </form>
          <div id="force-password-result" class="notice"></div>
        </section>
      </main>
    </div>

    <script src="/config.js?v=334eaba"></script>
    <script type="module" src="/auth.js?v=334eaba"></script>
  </body>
</html>
